<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vigía Recon — Dashboard</title>
<meta name="description" content="Sign in to Vigía Recon to see your domains' vitals and security score.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght,SOFT@9..144,600..900,100&display=swap" rel="stylesheet">
<meta name="theme-color" content="#3a2314">
<!-- Supabase client, pinned and served from this repo (see vendor/README.md) -->
<script src="vendor/supabase-js-2.118.0.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK"></script>
<style>
  /* 1970s theme shared with index.html and the portfolio */
  :root{
    --bg:#f1e3c6; --bg-alt:#e8d5b0; --surface:#faf1df; --surface-2:#ead8b3;
    --border:#cdb084; --border-soft:#dcc59c;
    --text:#3a2314; --text-dim:#6b4a32; --text-faint:#8a6a4c;
    --cream:#f6e7c8; --cream-hi:#fff4e0;
    --gold:#e0a526; --orange:#c8561b; --orange-ink:#a8460f; --rust:#a3361a;
    --avocado:#6b7a1f; --avocado-ink:#55621a; --brown:#5a3420; --wood:#3a2314;
    --sev-critical:#97280f; --sev-high:#c25417; --sev-medium:#e0a526; --sev-low:#ead8b3;
    --display:'Fraunces', Georgia, serif;
    --sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

    /* old names still used by inline styles and script-built HTML */
    --bg-panel:var(--surface); --bg-panel-hi:var(--surface-2);
    --ink:var(--text); --ink-soft:var(--text-dim);
    --cyan:var(--avocado-ink); --magenta:var(--rust); --amber:var(--orange-ink);
    --line:var(--border);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{overflow-x:clip;}
  body{
    background:repeating-linear-gradient(90deg, rgba(90,52,32,0.025) 0 2px, transparent 2px 6px), var(--bg);
    color:var(--text); font-family:var(--sans); line-height:1.55; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--gold); color:var(--wood);}
  :focus-visible{outline:3px solid var(--orange); outline-offset:3px; border-radius:6px;}
  .display{font-family:var(--display); font-variation-settings:'SOFT' 100;}
  .mono{font-family:var(--mono);}
  .wrap{max-width:760px; margin:0 auto; padding:0 24px;}

  nav{background:rgba(58,35,20,0.97);}
  nav::after{content:''; display:block; height:12px;
    background:linear-gradient(180deg, var(--gold) 0 20%, var(--orange) 20% 40%, var(--rust) 40% 60%, var(--avocado) 60% 80%, var(--brown) 80% 100%);}
  .navrow{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; max-width:760px; margin:0 auto; padding:16px 24px;}
  .logo{display:flex; align-items:center; gap:10px; color:var(--cream); text-decoration:none; font-family:var(--display); font-variation-settings:'SOFT' 100; font-weight:800; font-size:21px;}
  .logo-mark{width:26px; height:26px; flex-shrink:0;}
  nav .btn{padding:8px 16px; font-size:13px; border-color:#e3cfa6; color:var(--cream);}
  nav .btn:hover{background:var(--gold); border-color:var(--gold); color:var(--wood);}
  nav #delete-account-btn{color:#f0a04b !important; border-color:#f0a04b !important;}
  nav #delete-account-btn:hover{background:var(--rust); border-color:var(--rust) !important; color:var(--cream-hi) !important;}

  .btn{display:inline-flex; align-items:center; justify-content:center; padding:11px 20px; border-radius:999px; font-weight:700; font-size:14px; border:2px solid var(--brown); background:transparent; cursor:pointer; color:var(--brown); font-family:inherit; transition:background .15s, color .15s, border-color .15s;}
  .btn:hover{background:var(--avocado); border-color:var(--avocado); color:var(--cream-hi);}
  .btn-primary{background:var(--orange-ink); color:var(--cream-hi); border-color:var(--orange-ink);}
  .btn-primary:hover{background:var(--rust); border-color:var(--rust);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}

  main, main.wrap{padding-top:44px; padding-bottom:80px;}
  h1{font-family:var(--display); font-variation-settings:'SOFT' 100; font-size:34px; font-weight:900; color:var(--brown); margin-bottom:6px; line-height:1.1;}
  #dashboard-view > h1{display:inline-block; border-bottom:6px solid var(--orange); padding-bottom:4px;}
  .subtext{color:var(--text-dim); font-size:15px; margin-bottom:28px;}

  .auth-card{background:var(--surface); border-radius:22px; padding:34px 32px; max-width:420px; margin:56px auto; border:2px solid var(--border); box-shadow:8px 8px 0 var(--gold), 16px 16px 0 var(--avocado);}
  .auth-card h1{font-size:28px; text-align:center;}
  .auth-card .subtext{text-align:center; margin-bottom:22px;}
  label{display:block; font-size:13px; font-weight:600; margin-bottom:6px; margin-top:16px; color:var(--text);}
  input{width:100%; padding:11px 14px; border-radius:12px; border:2px solid var(--border); font-family:inherit; font-size:15px; background:var(--cream-hi); color:var(--text);}
  input::placeholder{color:var(--text-faint);}
  input:focus{outline:none; border-color:var(--orange);}
  .auth-card .btn{width:100%; margin-top:22px;}
  .auth-toggle{text-align:center; margin-top:16px; font-size:13px; color:var(--text-dim);}
  .auth-toggle button{background:none; border:none; color:var(--orange-ink); font-weight:700; text-decoration:underline; cursor:pointer; font-size:13px; font-family:inherit;}
  .message{font-size:13px; padding:10px 14px; border-radius:12px; margin-top:14px; border:2px solid transparent;}
  .message.error{background:rgba(163,54,26,0.08); border-color:rgba(163,54,26,0.35); color:var(--rust);}
  .message.success{background:rgba(107,122,31,0.1); border-color:rgba(107,122,31,0.4); color:var(--avocado-ink);}

  /* profile strip (inline-styled container) */
  #dashboard-view > div:first-child{border-radius:20px !important; border:2px solid var(--border) !important; border-left:10px solid var(--gold) !important;}
  #avatar-placeholder{font-family:var(--display) !important; color:var(--brown) !important; background:var(--surface-2) !important;}

  .add-row{display:flex; gap:10px; margin-bottom:28px;}
  .add-row input{flex:1;}
  .add-row .btn{white-space:nowrap;}
  .domain-list{display:flex; flex-direction:column; gap:16px;}
  .domain-name{font-weight:600; font-size:15px; font-family:var(--mono);}
  .domain-added{font-size:12px; color:var(--text-faint);}
  .remove-btn{background:none; border:none; color:var(--rust); font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;}
  .remove-btn:hover{text-decoration:underline;}
  .empty-state{text-align:center; padding:48px 24px; color:var(--text-dim); font-size:15px; background:var(--surface); border-radius:20px; border:2px dashed var(--border);}

  /* ---- domain cards + security scan ---- */
  .domain-card{background:var(--surface); padding:18px 20px; border:2px solid var(--border); border-radius:20px; transition:box-shadow .15s, border-color .15s;}
  .domain-card:hover{border-color:var(--orange); box-shadow:6px 6px 0 var(--brown);}
  .domain-card:nth-child(3n+1){border-top:10px solid var(--gold);}
  .domain-card:nth-child(3n+2){border-top:10px solid var(--orange);}
  .domain-card:nth-child(3n){border-top:10px solid var(--avocado);}
  .domain-top{display:flex; align-items:center; justify-content:space-between; gap:14px;}
  .domain-meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .chip{font-family:var(--mono); font-size:11px; font-weight:600; padding:3px 10px; border-radius:999px; border:1.5px solid var(--border); color:var(--text-dim); background:var(--cream-hi); white-space:nowrap;}
  .chip.ok{color:var(--avocado-ink); border-color:rgba(107,122,31,0.5); background:rgba(107,122,31,0.1);}
  .chip.warn{color:var(--orange-ink); border-color:rgba(200,86,27,0.5); background:rgba(200,86,27,0.08);}
  .grade{width:50px; height:50px; flex-shrink:0; border-radius:14px; background:var(--wood); display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--display); font-variation-settings:'SOFT' 100; font-weight:900; font-size:24px; line-height:1;}
  .grade small{font-family:var(--mono); font-size:9.5px; font-weight:600; margin-top:3px; color:#c9a77a;}
  .grade.g-A, .grade.g-B{color:#b5c449;}
  .grade.g-C{color:var(--gold);}
  .grade.g-D, .grade.g-F{color:#f0654a;}
  .grade.g-none{color:#c9a77a;}
  .link-btn{background:none; border:none; color:var(--orange-ink); font-size:13.5px; font-weight:700; cursor:pointer; padding:0; font-family:inherit;}
  .link-btn:hover{text-decoration:underline;}
  .panel{margin-top:14px; border-top:2px dashed var(--border-soft); padding-top:14px;}
  .verify-box{background:var(--bg-alt); border-radius:14px; padding:14px 16px; font-size:13.5px; color:var(--text-dim);}
  .verify-box b{color:var(--text);}
  .verify-box code{display:block; margin:10px 0; padding:10px 12px; background:var(--wood); border-radius:10px; color:var(--cream); font-family:var(--mono); font-size:12.5px; word-break:break-all; user-select:all;}
  .finding{padding:14px 0; border-bottom:1px solid var(--border-soft);}
  .finding:last-child{border-bottom:none;}
  .finding-head{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .sev{font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:0.08em; padding:3px 9px; border-radius:999px; flex-shrink:0; text-transform:uppercase; border:2px solid transparent;}
  .sev-critical{background:var(--sev-critical); color:var(--cream-hi);}
  .sev-high{background:var(--sev-high); color:var(--cream-hi);}
  .sev-medium{background:var(--sev-medium); color:var(--wood);}
  .sev-low{background:var(--sev-low); color:var(--wood); border-color:var(--border);}
  .sev-info{background:transparent; color:var(--brown); border-color:var(--brown);}
  .finding-title{font-weight:700; font-size:14.5px;}
  .finding-detail{font-size:13.5px; color:var(--text-dim); margin-top:4px;}
  .finding-fix{font-size:13.5px; margin-top:6px;}
  .finding-fix b{color:var(--avocado-ink); font-weight:700;}
  .scan-note{font-size:12.5px; color:var(--text-faint); margin-top:10px; font-family:var(--mono);}
  @media (max-width:520px){
    .add-row{flex-direction:column;}
    .domain-top{align-items:flex-start;}
    .auth-card{padding:28px 22px; box-shadow:6px 6px 0 var(--gold), 12px 12px 0 var(--avocado);}
    #dashboard-view > div:first-child{flex-wrap:wrap;}
    #dashboard-view > div:first-child > div[style*="flex:1"]{flex:1 1 200px !important;}
    #dashboard-view > div:first-child > div[style*="flex-direction:column"]{flex-direction:row !important; width:100%;}
    #dashboard-view > div:first-child > div[style*="flex-direction:column"] > *{flex:1;}
  }

  label.btn{margin:0;}

  .hidden{display:none !important;}
</style>
</head>
<body>

<nav>
  <div class="navrow">
    <a href="index.html" class="logo">
      <svg class="logo-mark" viewBox="0 0 26 26" aria-hidden="true">
        <circle cx="13" cy="13" r="12" fill="none" stroke="#e0a526" stroke-width="2"/>
        <circle cx="13" cy="13" r="7" fill="none" stroke="#c8561b" stroke-width="2"/>
        <circle cx="13" cy="13" r="2.6" fill="#b5c449"/>
      </svg>
      Vigía Recon
    </a>
    <div style="display:flex; gap:8px;">
      <button id="logout-btn" class="btn hidden">Log out</button>
      <button id="delete-account-btn" class="btn hidden" style="color:var(--magenta); border-color:var(--magenta);">Delete account</button>
    </div>
  </div>
</nav>

<main class="wrap">

  <div id="auth-view">
    <div class="auth-card">
      <h1 id="auth-title">Log in</h1>
      <p class="subtext">Watch your sites the way an attacker would.</p>

      <form id="auth-form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">

        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" minlength="8">
        <div id="password-hint" class="hidden" style="font-size:12px; color:var(--ink-soft); margin-top:6px;">
          At least 8 characters, with uppercase, lowercase, a number, and a special character.
        </div>

        <button type="submit" class="btn btn-primary" id="auth-submit">Log in</button>
      </form>

      <div class="auth-toggle">
        <span id="toggle-text">Don't have an account?</span>
        <button id="toggle-btn">Sign up</button>
      </div>
      <div class="auth-toggle" id="forgot-password-row">
        <button id="forgot-password-btn">Forgot password?</button>
      </div>

      <div id="auth-message"></div>
    </div>
  </div>

  <div id="dashboard-view" class="hidden">
    <div style="display:flex; align-items:center; gap:16px; margin-bottom:32px; padding:20px; background:var(--bg-panel); border:1px solid var(--line); border-radius:10px;">
      <img id="avatar-preview" src="" class="hidden" style="width:56px; height:56px; border-radius:50%; object-fit:cover; border:2px solid var(--line);">
      <div id="avatar-placeholder" style="width:56px; height:56px; border-radius:50%; background:var(--line); display:flex; align-items:center; justify-content:center;  font-weight:700; font-size:20px; color:var(--ink-soft);">?</div>
      <div style="flex:1;">
        <input type="text" id="display-name" placeholder="Display name" style="margin-bottom:8px;">
        <input type="tel" id="phone" placeholder="Phone number (optional)">
      </div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <label class="btn" style="text-align:center; cursor:pointer; font-size:13px;">
          Change photo
          <input type="file" id="avatar-input" accept="image/*" class="hidden">
        </label>
        <button id="save-profile-btn" class="btn btn-primary" style="font-size:13px;">Save</button>
      </div>
    </div>
    <div id="profile-message"></div>

    <h1>Your domains</h1>
    <p class="subtext" id="account-email"></p>

    <div class="add-row">
      <input type="text" id="new-domain" placeholder="example.com">
      <button id="add-domain-btn" class="btn btn-primary">Add domain</button>
    </div>
    <div id="dashboard-message"></div>

    <div id="domain-list" class="domain-list hidden"></div>
    <div id="empty-state" class="empty-state hidden">
      No domains yet. Add one above to start monitoring it.
    </div>
  </div>

</main>

<script>
  // ---- Fill these in with your real Supabase project details ----
  const SUPABASE_URL = "https://bvyffyzzoloiiooeaaup.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ2eWZmeXp6b2xvaWlvb2VhYXVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNjIyODgsImV4cCI6MjEwMjgzODI4OH0.CKTTn-UYD9i4gpRo-sBFsY86x6tx0EF4anhwWnG2zWQ";

  const { createClient } = supabase;

  // Everything shown from the database or the scanner (including CVE
  // text pulled from outside sources) goes through this before it
  // touches innerHTML, so it can't inject script into the page.
  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, function(c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let isSignUp = false;
  let currentAccountId = null;

  const authView = document.getElementById("auth-view");
  const dashboardView = document.getElementById("dashboard-view");
  const authForm = document.getElementById("auth-form");
  const authTitle = document.getElementById("auth-title");
  const authSubmit = document.getElementById("auth-submit");
  const toggleBtn = document.getElementById("toggle-btn");
  const forgotPasswordBtn = document.getElementById("forgot-password-btn");
  const toggleText = document.getElementById("toggle-text");
  const authMessage = document.getElementById("auth-message");
  const logoutBtn = document.getElementById("logout-btn");
  const deleteAccountBtn = document.getElementById("delete-account-btn");
  const accountEmailEl = document.getElementById("account-email");
  const domainListEl = document.getElementById("domain-list");
  const emptyStateEl = document.getElementById("empty-state");
  const addDomainBtn = document.getElementById("add-domain-btn");
  const newDomainInput = document.getElementById("new-domain");
  const dashboardMessage = document.getElementById("dashboard-message");
  const displayNameInput = document.getElementById("display-name");
  const phoneInput = document.getElementById("phone");
  const avatarInput = document.getElementById("avatar-input");
  const avatarPreview = document.getElementById("avatar-preview");
  const avatarPlaceholder = document.getElementById("avatar-placeholder");
  const saveProfileBtn = document.getElementById("save-profile-btn");
  const profileMessage = document.getElementById("profile-message");
  let currentUserId = null;

  const passwordHint = document.getElementById("password-hint");

  toggleBtn.addEventListener("click", () => {
    isSignUp = !isSignUp;
    authTitle.textContent = isSignUp ? "Sign up" : "Log in";
    authSubmit.textContent = isSignUp ? "Sign up" : "Log in";
    toggleText.textContent = isSignUp ? "Already have an account?" : "Don't have an account?";
    toggleBtn.textContent = isSignUp ? "Log in" : "Sign up";
    authMessage.innerHTML = "";
    passwordHint.classList.toggle("hidden", !isSignUp);
  });

  forgotPasswordBtn.addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    if (!email) {
      authMessage.innerHTML = '<div class="message error">Type your email above first, then click "Forgot password?" again.</div>';
      return;
    }
    authMessage.innerHTML = "";
    forgotPasswordBtn.disabled = true;

    const { error } = await db.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.href,
    });

    if (error) {
      authMessage.innerHTML = '<div class="message error">' + escapeHtml(error.message) + '</div>';
    } else {
      authMessage.innerHTML = '<div class="message success">Check your email for a password reset link.</div>';
    }
    forgotPasswordBtn.disabled = false;
  });

  // When someone clicks the reset link in their email, Supabase
  // sends them back here in a special "password recovery" state.
  // Detect that and switch the form into "set a new password" mode.
  let inRecoveryMode = false;
  db.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") {
      inRecoveryMode = true;
      authTitle.textContent = "Set a new password";
      document.querySelector('label[for="email"]').classList.add("hidden");
      document.getElementById("email").classList.add("hidden");
      passwordHint.classList.remove("hidden");
      authSubmit.textContent = "Set new password";
      document.querySelectorAll(".auth-toggle").forEach((el) => el.classList.add("hidden"));
    }
  });

  function checkPasswordStrength(password) {
    const problems = [];
    if (password.length < 8) problems.push("at least 8 characters");
    if (!/[a-z]/.test(password)) problems.push("a lowercase letter");
    if (!/[A-Z]/.test(password)) problems.push("an uppercase letter");
    if (!/[0-9]/.test(password)) problems.push("a number");
    if (!/[!@#$%^&*()_+\-=[\]{};':"|<>?,./`~]/.test(password)) problems.push("a special character (like ! or @ or #)");
    return problems;
  }

  authForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (inRecoveryMode) {
      const password = document.getElementById("password").value;
      const problems = checkPasswordStrength(password);
      if (problems.length > 0) {
        authMessage.innerHTML = '<div class="message error">Password needs: ' + problems.join(", ") + '.</div>';
        return;
      }
      authSubmit.disabled = true;
      const { error } = await db.auth.updateUser({ password });
      if (error) {
        authMessage.innerHTML = '<div class="message error">' + escapeHtml(error.message) + '</div>';
      } else {
        authMessage.innerHTML = '<div class="message success">Password updated. Reloading...</div>';
        setTimeout(() => location.reload(), 2000);
      }
      authSubmit.disabled = false;
      return;
    }

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    authMessage.innerHTML = "";

    if (isSignUp) {
      const problems = checkPasswordStrength(password);
      if (problems.length > 0) {
        authMessage.innerHTML = '<div class="message error">Password needs: ' + problems.join(", ") + '.</div>';
        return;
      }
    }

    authSubmit.disabled = true;

    try {
      if (isSignUp) {
        const { error } = await db.auth.signUp({ email, password });
        if (error) throw error;
        authMessage.innerHTML = '<div class="message success">Check your email to confirm your account, then log in.</div>';
      } else {
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) throw error;
        await onLoggedIn();
      }
    } catch (err) {
      authMessage.innerHTML = '<div class="message error">' + err.message + '</div>';
    } finally {
      authSubmit.disabled = false;
    }
  });

  logoutBtn.addEventListener("click", async () => {
    await db.auth.signOut();
    location.reload();
  });

  deleteAccountBtn.addEventListener("click", async () => {
    const confirmed = confirm(
      "This permanently deletes your account, every domain you're monitoring, and your login. This cannot be undone. Are you sure?"
    );
    if (!confirmed) return;

    deleteAccountBtn.disabled = true;
    const { error } = await db.rpc("delete_own_account");

    if (error) {
      dashboardMessage.innerHTML = '<div class="message error">' + escapeHtml(error.message) + '</div>';
      deleteAccountBtn.disabled = false;
      return;
    }

    alert("Your account has been deleted.");
    location.reload();
  });

  async function ensureAccountExists(user) {
    const { data, error } = await db.rpc("claim_account");
    if (error) throw error;
    return data;
  }

  async function onLoggedIn() {
    const { data: { user } } = await db.auth.getUser();
    if (!user) return;

    const account = await ensureAccountExists(user);
    currentAccountId = account.id;
    currentUserId = user.id;

    authView.classList.add("hidden");
    dashboardView.classList.remove("hidden");
    logoutBtn.classList.remove("hidden");
    deleteAccountBtn.classList.remove("hidden");
    accountEmailEl.textContent = "Logged in as " + user.email;

    displayNameInput.value = account.display_name || "";
    phoneInput.value = account.phone || "";
    if (account.avatar_url) {
      avatarPreview.src = account.avatar_url;
      avatarPreview.classList.remove("hidden");
      avatarPlaceholder.classList.add("hidden");
    } else {
      avatarPlaceholder.textContent = (account.display_name || user.email)[0].toUpperCase();
    }

    await loadDomains();
  }

  async function loadDomains() {
    const { data, error } = await db
      .from("domains")
      .select("id, hostname, created_at, verify_token, verified_at, alert_state(security_score, security_findings, last_security_scan_at, last_ssl_days_left, last_domain_days_left)")
      .order("created_at", { ascending: false });

    if (error) {
      dashboardMessage.innerHTML = '<div class="message error">' + escapeHtml(error.message) + '</div>';
      return;
    }

    if (data.length === 0) {
      domainListEl.classList.add("hidden");
      emptyStateEl.classList.remove("hidden");
      return;
    }

    emptyStateEl.classList.add("hidden");
    domainListEl.classList.remove("hidden");
    domainListEl.innerHTML = data.map(renderDomain).join("");

    document.querySelectorAll(".remove-btn").forEach(function(btn) {
      btn.addEventListener("click", async function() {
        const id = btn.getAttribute("data-id");
        if (!confirm("Stop monitoring this domain?")) return;
        await db.from("domains").delete().eq("id", id);
        await loadDomains();
      });
    });

    document.querySelectorAll("[data-toggle]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        const panel = document.getElementById(btn.getAttribute("data-toggle"));
        panel.classList.toggle("hidden");
      });
    });
  }

  function gradeFor(score) {
    if (score == null) return null;
    if (score >= 90) return "A";
    if (score >= 80) return "B";
    if (score >= 65) return "C";
    if (score >= 50) return "D";
    return "F";
  }

  function renderDomain(d) {
    // alert_state is one-to-one, but may come back as an object or a one-item array.
    const st = Array.isArray(d.alert_state) ? d.alert_state[0] : d.alert_state;
    const score = st ? st.security_score : null;
    const grade = gradeFor(score);
    const findings = (st && st.security_findings) || [];
    const counts = { critical: 0, high: 0, medium: 0, low: 0 };
    findings.forEach(function(f) { if (f.severity in counts) counts[f.severity]++; });
    const id = escapeHtml(d.id);

    const chips = [];
    if (d.verified_at) chips.push('<span class="chip ok">✓ verified</span>');
    else chips.push('<span class="chip warn">unverified</span>');
    if (st && st.last_ssl_days_left != null) chips.push('<span class="chip">SSL ' + escapeHtml(st.last_ssl_days_left) + 'd</span>');
    if (st && st.last_domain_days_left != null) chips.push('<span class="chip">reg ' + escapeHtml(st.last_domain_days_left) + 'd</span>');
    if (counts.critical) chips.push('<span class="chip" style="color:var(--magenta);">' + counts.critical + ' critical</span>');
    if (counts.high) chips.push('<span class="chip" style="color:var(--magenta);">' + counts.high + ' high</span>');
    if (counts.medium) chips.push('<span class="chip warn">' + counts.medium + ' medium</span>');

    const gradeBox = grade
      ? '<div class="grade g-' + grade + '">' + grade + '<small>' + escapeHtml(score) + '</small></div>'
      : '<div class="grade g-none" title="Not scanned yet">–<small>new</small></div>';

    let verifyPanel = "";
    if (!d.verified_at) {
      verifyPanel =
        '<div class="panel hidden" id="verify-' + id + '">' +
          '<div class="verify-box">' +
            'Prove you own this domain to unlock active checks (exposed .git, .env, database dumps). Add this <b>TXT</b> record to <b>' + escapeHtml(d.hostname) + '</b> at your DNS provider:' +
            '<code>vigiarecon-verify=' + escapeHtml(d.verify_token) + '</code>' +
            'It\'s picked up on the next daily scan. Leave the record in place; if it\'s removed, active checks stop.' +
          '</div>' +
        '</div>';
    }

    let findingsHtml;
    if (!st || !st.last_security_scan_at) {
      findingsHtml = '<p class="scan-note">Not scanned yet. Results appear after the next daily run.</p>';
    } else if (findings.length === 0) {
      findingsHtml = '<p class="scan-note">No issues found. Nice.</p>';
    } else {
      findingsHtml = findings.map(function(f) {
        const sev = ["critical", "high", "medium", "low", "info"].indexOf(f.severity) > -1 ? f.severity : "info";
        return '<div class="finding">' +
          '<div class="finding-head"><span class="sev sev-' + sev + '">' + sev + '</span>' +
          '<span class="finding-title">' + escapeHtml(f.title) + '</span></div>' +
          '<div class="finding-detail">' + escapeHtml(f.detail) + '</div>' +
          '<div class="finding-fix"><b>Fix:</b> ' + escapeHtml(f.fix) + '</div>' +
        '</div>';
      }).join("");
      findingsHtml += '<p class="scan-note">Last scanned ' + escapeHtml(new Date(st.last_security_scan_at).toLocaleString()) + '</p>';
    }

    return '<div class="domain-card">' +
      '<div class="domain-top">' +
        gradeBox +
        '<div style="flex:1; min-width:0;">' +
          '<div class="domain-name" style="overflow-wrap:anywhere;">' + escapeHtml(d.hostname) + '</div>' +
          '<div class="domain-added">Added ' + escapeHtml(new Date(d.created_at).toLocaleDateString()) + '</div>' +
        '</div>' +
        '<button class="remove-btn" data-id="' + id + '">Remove</button>' +
      '</div>' +
      '<div class="domain-meta">' + chips.join("") + '</div>' +
      '<div style="display:flex; gap:16px; margin-top:12px;">' +
        '<button class="link-btn" data-toggle="findings-' + id + '">Attacker\'s view (' + findings.length + ')</button>' +
        (d.verified_at ? '' : '<button class="link-btn" data-toggle="verify-' + id + '">Verify ownership</button>') +
      '</div>' +
      verifyPanel +
      '<div class="panel hidden" id="findings-' + id + '">' + findingsHtml + '</div>' +
    '</div>';
  }

  addDomainBtn.addEventListener("click", async () => {
    // Accept pasted URLs like "https://Example.com/path" and keep just the hostname.
    const hostname = newDomainInput.value.trim().toLowerCase()
      .replace(/^[a-z]+:\/\//, "").replace(/[\/?#:].*$/, "").replace(/\.$/, "");
    dashboardMessage.innerHTML = "";
    if (!hostname) return;
    if (!/^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/.test(hostname)) {
      dashboardMessage.innerHTML = '<div class="message error">Enter a public domain name like example.com (no IP addresses).</div>';
      return;
    }

    addDomainBtn.disabled = true;
    const { error } = await db
      .from("domains")
      .insert({ account_id: currentAccountId, hostname: hostname });

    if (error) {
      dashboardMessage.innerHTML = '<div class="message error">' + escapeHtml(error.message) + '</div>';
    } else {
      newDomainInput.value = "";
      await loadDomains();
    }
    addDomainBtn.disabled = false;
  });

  avatarInput.addEventListener("change", () => {
    const file = avatarInput.files[0];
    if (!file) return;
    // Show an instant local preview before the upload finishes.
    avatarPreview.src = URL.createObjectURL(file);
    avatarPreview.classList.remove("hidden");
    avatarPlaceholder.classList.add("hidden");
  });

  saveProfileBtn.addEventListener("click", async () => {
    saveProfileBtn.disabled = true;
    profileMessage.innerHTML = "";

    try {
      let avatarUrl = null;
      const file = avatarInput.files[0];

      if (file) {
        const filePath = currentUserId + "/avatar-" + Date.now();
        const { error: uploadError } = await db.storage
          .from("avatars")
          .upload(filePath, file, { upsert: true });
        if (uploadError) throw uploadError;

        const { data: urlData } = db.storage.from("avatars").getPublicUrl(filePath);
        avatarUrl = urlData.publicUrl;
      }

      const updates = {
        display_name: displayNameInput.value.trim(),
        phone: phoneInput.value.trim(),
      };
      if (avatarUrl) updates.avatar_url = avatarUrl;

      const { error } = await db.from("accounts").update(updates).eq("id", currentAccountId);
      if (error) throw error;

      profileMessage.innerHTML = '<div class="message success">Profile saved.</div>';
    } catch (err) {
      profileMessage.innerHTML = '<div class="message error">' + err.message + '</div>';
    } finally {
      saveProfileBtn.disabled = false;
    }
  });

  (async function() {
    const { data: { user } } = await db.auth.getUser();
    if (user) await onLoggedIn();
  })();
</script>

</body>
</html>
